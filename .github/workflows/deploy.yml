name: Production Deployment

on:
  push:
    branches: ["dev", "ci/#28_server_re_deploy"]
  workflow_dispatch:  # 수동 배포 가능

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt clean
          sudo docker system prune -af
          df -h

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create production application.yml
        run: |
          cd ./src/main/resources
          echo "${{ secrets.APPLICATION_PROD_YML }}" > ./application-prod.yml
          echo "${{ secrets.APPLICATION_JWT_YML }}" > ./application-jwt.yml
          echo "${{ secrets.APPLICATION_EMAIL_YML }}" > ./application-email.yml
          echo "${{ secrets.APPLICATION_REDIS_YML }}" > ./application-redis.yml
          echo "${{ secrets.APPLICATION_OAUTH_YML }}" > ./application-oauth.yml
          echo "${{ secrets.APPLICATION_AI_YML }}" > ./application-ai.yml
        shell: bash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/returnwork:${{ github.sha }},${{ secrets.DOCKER_USERNAME }}/returnwork:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file for production
        run: |
          echo "SPRING_PROFILES_ACTIVE=prod" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "DOCKER_IMAGE=${{ secrets.DOCKER_USERNAME }}/returnwork:${{ github.sha }}" >> .env

      - name: Create deployment script
        run: |
          cat > deploy.sh << 'EOF'
          #!/bin/bash
          set -e  # 에러 발생시 즉시 종료
          
          # Docker 권한 설정
          sudo usermod -aG docker $USER || true
          sudo chmod 666 /var/run/docker.sock || true
          
          NEW_IMAGE="${1}"
          BACKUP_TAG="backup-$(date +%Y%m%d-%H%M%S)"
          
          echo "Starting deployment..."
          echo "New image: $NEW_IMAGE"
          
          # 현재 실행중인 컨테이너가 있으면 백업
          if docker-compose ps | grep -q "Up"; then
            CURRENT_IMAGE=$(docker-compose images -q app)
            if [ ! -z "$CURRENT_IMAGE" ]; then
              echo "Backing up current image as: $BACKUP_TAG"
              docker tag $CURRENT_IMAGE ${{ secrets.DOCKER_USERNAME }}/returnwork:$BACKUP_TAG
            fi
          fi
          
          # 배포 실행
          echo "Stopping current services..."
          docker-compose down --remove-orphans
          
          echo "Pulling new image..."
          docker-compose pull
          
          echo "Starting services..."
          docker-compose up -d
          
          # Health Check (개선된 버전)
          echo "Health checking..."
          MAX_ATTEMPTS=15
          ATTEMPT=0
          
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            if curl -f -s http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "Health check passed!"
              echo "Cleaning up old images..."
              docker images ${{ secrets.DOCKER_USERNAME }}/returnwork --format "{{.Repository}}:{{.Tag}}" | grep -v latest | grep -v ${{ github.sha }} | grep -v backup | head -n -3 | xargs -r docker rmi || true
              exit 0
            fi
          
            ATTEMPT=$((ATTEMPT + 1))
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS failed, retrying in 10s..."
            sleep 10
          done
          
          # Health check 실패 - 롤백 시도
          echo "Health check failed after $((MAX_ATTEMPTS * 10)) seconds"
          echo "Application logs:"
          docker-compose logs --tail=30 app
          
          # 백업 이미지가 있으면 롤백
          if docker images | grep -q "$BACKUP_TAG"; then
            echo "Rolling back to previous version..."
            docker-compose down
            docker tag ${{ secrets.DOCKER_USERNAME }}/returnwork:$BACKUP_TAG $NEW_IMAGE
            docker-compose up -d
          
            # 롤백된 버전 health check
            sleep 15
            if curl -f -s http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "Rollback successful - previous version is running"
              exit 1  # 배포는 실패했지만 서비스는 복구됨
            else
              echo "Rollback also failed - manual intervention required"
              exit 1
            fi
          else
            echo "No backup available - deployment failed"
            exit 1
          fi
          EOF
          
          chmod +x deploy.sh

      - name: Deploy to EC2
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "$EC2_SSH_KEY" | base64 -d > private_key.pem
          chmod 600 private_key.pem
          
          # Copy deployment files to server
          echo "Copying files to server..."
          scp -i private_key.pem -o StrictHostKeyChecking=no docker-compose.yml $EC2_USERNAME@$EC2_HOST:/home/$EC2_USERNAME/
          scp -i private_key.pem -o StrictHostKeyChecking=no .env $EC2_USERNAME@$EC2_HOST:/home/$EC2_USERNAME/
          scp -i private_key.pem -o StrictHostKeyChecking=no deploy.sh $EC2_USERNAME@$EC2_HOST:/home/$EC2_USERNAME/
          
          # Execute deployment
          ssh -i private_key.pem -o StrictHostKeyChecking=no $EC2_USERNAME@$EC2_HOST "
            echo '${{ secrets.DOCKER_PASSWORD }}' | docker login -u '${{ secrets.DOCKER_USERNAME }}' --password-stdin
          
            ./deploy.sh '${{ secrets.DOCKER_USERNAME }}/returnwork:${{ github.sha }}'
          " && echo "Deployment completed successfully!" || {
            echo "Deployment failed!"
            rm -f private_key.pem
            exit 1
          }
          
          rm -f private_key.pem